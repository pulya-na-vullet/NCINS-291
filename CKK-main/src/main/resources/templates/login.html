<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему – QA Manager</title>

    <!-- Bootstrap + Font-Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Ваш общий стиль -->
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Дополнительные локальные стили для страницы входа */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 15px;
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .login-header h3 {
            margin: 0;
            font-weight: 600;
        }
        .login-body {
            padding: 2rem;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: border-color 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            border-radius: 10px;
            font-weight: 600;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .demo-accounts {
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="card login-card shadow">
        <!-- Шапка -->
        <div class="login-header">
            <i class="fas fa-sign-in-alt fa-2x mb-2"></i>
            <h3>Вход в систему</h3>
        </div>

        <!-- Тело -->
        <div class="login-body">
            <!-- Сообщения об ошибках / выходе -->
            {% if login_error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>Неверный логин или пароль
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}
            {% if logged_out %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                <i class="fas fa-info-circle me-2"></i>Вы вышли из системы
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <!-- Форма -->
            <form action="/login" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Имя пользователя</label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control form-control-lg"
                           placeholder="admin / analyst / tester"
                           required
                           autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Пароль</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control form-control-lg"
                           placeholder="Пароль"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-login btn-lg">
                        <i class="fas fa-sign-in-alt me-2"></i>Войти
                    </button>
                </div>
            </form>

            <!-- Подсказка -->
            <div class="text-center mt-4 demo-accounts">
                <small>Демо-учётки:</small><br>
                <code>admin / admin</code> |
                <code>analyst / analyst</code> |
                <code>tester / tester</code>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
